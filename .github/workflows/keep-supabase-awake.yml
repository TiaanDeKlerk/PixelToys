# Free Supabase projects pause after about a week with no activity.
# This visits the shop's public settings once a day so the project stays awake.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 6 * * *"   # every day at 06:17 UTC (08:17 in South Africa)
  workflow_dispatch:        # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Visit the shop database
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "https://rwmcrnmtyeilhmzgaaom.supabase.co/rest/v1/settings?select=tagline" \
            -H "apikey: sb_publishable_x6UIEY-r9Wk0weU1PyGCMQ_o22ogLjV"
